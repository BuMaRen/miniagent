# 小说生成工作流的声明式定义 —— docs/workflow-design.md §4 的具体落地。
#
# 这份文件本身不含任何 Stage 的实现细节(那些在 stages.py 里),只描述
# Sequence/Loop/ForEach/Checkpoint 怎么拼接;由 workflow.py 读取后,
# 结合 stages.build_stage_registry() 产出的 NodeRegistry,交给
# engine.workflow.Workflow.from_spec 组装成可执行的 Workflow。
workflow: novel_generation
state_schema: story_bible

stages:
  # model 是可选字段,与节点自己的原语关键字(sequence/loop/foreach/stage)同级
  # 出现:标注在这里之后,本节点及其包含的全部子节点都会用这个模型,除非某个
  # 子节点自己也标了 model(那就以子节点的为准,不再继续从这里往下继承)。
  # 立意扩展与角色/世界观设计最吃"设定的一致性与创造力",这里显式钉住用
  # claude-sonnet-5;没有标注 model 的节点(如下面几段)退回 client_factory 的
  # 默认模型(见 run.py build_llm_client 的 NOVEL_MODEL 环境变量)。
  - sequence:
      - input_parsing
      - concept_expansion
      - character_world_design
    model: claude-sonnet-latest

  # Loop 的一轮就是把 body 依次跑一遍(Sequence 的规则),跑完没人要求重来就算
  # 通过。continue_when 是一条状态路径("是非器"):每个 body 节点跑完后,引擎读
  # 它的真假——真则本轮到此为止、从 body[0] 重开一轮。引擎不认识 needs_revision
  # 这个名字,是这里指给它看的。
  #
  # 判定放在每个节点之后(而不是整条 body 跑完之后)带来两件事:
  #   · 短路:outline_critic 判否时,后面的人工确认 confirm_outline 根本不执行
  #     ——不必拿一份 AI 都没过的草稿去打扰人。
  #   · 人工与 AI 平权:confirm_outline 填的 needs_revision 与 AI 的一样驱动下一轮
  #     从 outline_generation 重写,且下一轮 AI 与人工都要再看一次。
  # 上一轮为什么没过,由引擎发布在游标 _loop.outline_loop.last 里,
  # outline_generation 用普通的 reads 读它(见 stages.OUTLINE_LOOP_LAST_PATH)。
  - loop:
      name: outline_loop
      continue_when: _loop.outline_loop.last.needs_revision
      max_iterations: 4
      body:
        - outline_generation
        - outline_critic
        - confirm_outline
      on_exceed: escalate_to_checkpoint

  - foreach:
      name: chapter_loop
      items_path: story_bible.chapters
      body:
        sequence:
          # 与 outline_loop 同构:AI 审校通过后才轮到人工确认,人工反馈同样驱动
          # chapter_drafting 就地重写本章(撰写与修订本就是同一件事、同一套约束,
          # 所以不需要单独的 reviser 节点)。
          - loop:
              name: chapter_review_loop
              continue_when: _loop.chapter_review_loop.last.needs_revision
              max_iterations: 4
              body:
                - chapter_drafting
                - chapter_critic
                - chapter_pause
              on_exceed: escalate_to_checkpoint
          # 只有这个 Loop 整体通过(AI 与人工都点头)才会走到这一步,
          # 把该章 status 推进到 "reviewed"。它同时能从 Loop 输出的 _loop
          # 记账里看出这一章是"真通过"还是"跑满轮次后被裁决放行"的。
          - chapter_finalize

  - sequence:
      - manuscript_assembly_polish
      - final_qa
