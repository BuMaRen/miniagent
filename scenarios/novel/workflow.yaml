# 小说生成工作流的声明式定义 —— docs/workflow-design.md §4 的具体落地。
#
# 这份文件本身不含任何 Stage 的实现细节(那些在 stages.py 里),只描述
# Sequence/Loop/ForEach/Checkpoint 怎么拼接;由 workflow.py 读取后,
# 结合 stages.build_stage_registry() 产出的 NodeRegistry,交给
# engine.workflow.Workflow.from_spec 组装成可执行的 Workflow。
workflow: novel_generation
state_schema: story_bible

stages:
  - sequence:
      - input_parsing
      - concept_expansion
      - character_world_design

  # outline_review 是一条 ReviewChain([outline_critic, confirm_outline]):
  # 每轮先过 AI 评审,AI 通过后才轮到人工把关(confirm_outline 是个
  # Checkpoint,但复用了 critic 的 {"passed", "feedback"} 契约,详见
  # stages.build_outline_review_chain)。人工不通过时给的 feedback 与 AI 不
  # 通过时一样驱动 outline_generation 重写,下一轮重新走一遍这整条链——AI 与
  # 人工都要再看一次,而不是让人工反馈单独绕开 AI 复核再走一条独立循环。
  - loop:
      name: outline_loop
      producer: outline_generation
      critic: outline_review
      reviser: outline_generation
      max_iterations: 3
      on_exceed: escalate_to_checkpoint

  - foreach:
      name: chapter_loop
      items_path: story_bible.chapters
      body:
        sequence:
          # chapter_review 同理是 ReviewChain([chapter_critic, chapter_pause]):
          # AI 审校通过后才请人工确认,人工反馈驱动 chapter_revision 就地重写
          # 本章,下一轮重新过一遍 AI + 人工。
          - loop:
              name: chapter_review_loop
              producer: chapter_drafting
              critic: chapter_review
              reviser: chapter_revision
              max_iterations: 3
              on_exceed: escalate_to_checkpoint
          # 只有这个 Loop 整体通过(AI 与人工都点头)才会走到这一步,
          # 把该章 status 推进到 "reviewed"。
          - chapter_finalize

  - sequence:
      - manuscript_assembly_polish
      - final_qa
