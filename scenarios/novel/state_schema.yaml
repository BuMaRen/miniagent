# 故事圣经(Story Bible)的字段声明 —— 对应 docs/story-bible-schema.md;引擎本身
# (state/schema.py)不含任何字段语义,这里就是"场景方提供的那份 Schema"。
#
# 相对文档的一处务实扩展:chapters[*] 增加了 text(本章定稿正文)与
# word_count 两个字段。文档原文只在 chapters 里保留 draft_summary(供后续
# 章节引用的摘要),理由是"只记会被引用的事实,避免状态膨胀"——但全文正文终究
# 要在某处落地,才能被"全文统稿"(3.9)与"最终输出"(3.10)阶段读到并写盘。
# Loop/ForEach 都只把上一节点的输出向前传给下一节点、不做跨轮累积(见
# engine/primitives/foreach.py 的模块 docstring),所以正文必须走 State Store
# 才能穿过 ForEach 的迭代边界——这里选择把它放进故事圣经而不是另开一份存储,
# 避免引入第二套"共享状态"概念。
#
# YAML DSL 见 state/schema.py 模块 docstring:标量类型名写作字符串
# str/int/float/bool,!optional 对应 Optional;OneOf 枚举与对象子结构一样,都是
# 在 types: 里具名声明、别处裸名引用,不需要标签(!optional 是这份 DSL 里唯一
# 保留的 YAML 标签)。
#
# characters/world/timeline/foreshadowing/chapters 的元素形状起在 types: 里
# 具名声明,而不是内联写在下面的 definition 里:scenarios/novel/stages.yaml 里
# 各 Stage 的 output_schema 也要用到同一份形状(如"逐章撰写"只产出/校验
# chapters[*] 那一条的结构),靠 state/schema.py 的 load_types() 从这份文件里
# 借出这张具名类型表,避免两处各自重复内联同一段结构。
name: story_bible
types:
  character_role:
    enum: [protagonist, antagonist, supporting]
  foreshadowing_status:
    enum: [planted, resolved, dropped]
  chapter_status:
    enum: [planned, drafted, reviewed]
  character:
    id: str
    name: str
    role: character_role
    goal: str
    motivation: str
    flaw: str
    arc: str
    relationships:
      - target_id: str
        relation: str
    status_log:
      - after_chapter: int
        state: str
  world_entry:
    id: str
    name: str
    description: str
    established_in_chapter: int
  timeline_event:
    chapter: int
    event: str
    involved_characters: [str]
  foreshadowing:
    id: str
    planted_in_chapter: int
    description: str
    payoff_chapter: !optional int
    status: foreshadowing_status
  chapter:
    index: int
    title: str
    beat_summary: str
    draft_summary: str
    text: str
    word_count: int
    status: chapter_status
definition:
  story_bible:
    meta:
      title: str
      logline: str
      theme: str
      core_conflict: str
      structure_template: str
      target_word_count: [int]
      genre: str
      pov: str
      tone: str
    characters: [character]
    world: [world_entry]
    timeline: [timeline_event]
    foreshadowing: [foreshadowing]
    chapters: [chapter]
  # ForEach 的游标(index/item)天然也落在 State 里、与 "story_bible" 平级
  # (见 engine/primitives/foreach.py 的默认路径 "_foreach.<name>.index/item")。
  # 这里特意不预先声明成 {} 或某个具体结构:empty_state() 若把它填成 {}, 后续
  # InMemoryStateStore._locate_parent 在其下新建 "chapter_loop" 这一层时看到的
  # 是"已存在的 dict"而非"缺失"，行为仍正确;但若声明成 any,_empty(ANY) 会
  # 填成 None,反而让 ForEach 第一次 patch 时在 None 上创建子层失败。所以干脆
  # 不在 definition 里声明这个键——它不属于故事圣经语义,由 ForEach 在首次写入
  # 时自己创建。
