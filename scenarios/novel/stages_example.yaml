# ---- stage define below -----

input_parsing:
  executor: input_parsing_executor
  writes:
    - story_bible.meta
concept_expansion:
  executor:
    model: claude-sonnet-latest
    tools:
      - research
    output_schema: concept_expansion_output # 必填，用于结构化输出
    prompt: @concept_expansion_prompt # 可以直接写也可以引用
  writes:
    - story_bible.meta
  reads:
    - story_bible.meta
  output_schema: concept_expansion_output # 指定来则会在 llm 返回后校验输出
character_world_design:
  executor:
    model: claude-sonnet-latest
    tools:
      - research
    output_schema: character_world_design_output # 必填，用于结构化输出
    prompt: @character_world_design_prompt # 可以直接写也可以引用
  writes:
    - story_bible.characters
    - story_bible.world_rules
  reads:
    - story_bible.meta
  output_schema: character_world_design_output # 指定来则会在 llm 返回后校验输出