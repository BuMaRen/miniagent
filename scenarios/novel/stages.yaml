# 小说生成工作流的**节点**声明 —— docs/workflow-design.md §4 那张表的逐行落地。
#
# 与 workflow.yaml 的分工:那份文件说"这些节点怎么串"(Sequence/Loop/ForEach 的
# 嵌套结构),这份文件说"每个节点是什么"(谁执行、读写哪些状态切片、输出要符合
# 哪份契约)。两份都由框架解析(engine/spec.py + engine/workflow.py),场景侧的
# stages.py 只剩下确实必须用 Python 表达的那几件事。
#
# 引用规则(详见 engine/spec.py 模块 docstring):
#   · executor / output_schema / tools 写的都是**名字**,分别去 ExecutorRegistry
#     (@executor 装饰器登记)、SchemaRegistry(schemas/*.yaml)、ToolSetRegistry
#     (toolsets/*.py)里检索——它们本身是对象,YAML 里写得下的只有名字。
#   · prompt 的值本身就是文本,所以引用要显式写成 "@名字"(去 prompts/*.prompt
#     里检索),不带 @ 的就是字面量正文。注意 @ 是 YAML 保留字符,**必须加引号**。
#   · agent executor 声明了 output_schema 之后,提示词里的 `@output_schema_example`
#     会被替换成该 schema 的示例 JSON——不必在提示词里手抄一份格式说明。
#
# model 也可以写在某个 executor 里作为该节点的默认模型,但本场景统一在
# workflow.yaml 的树上标注(编排层标注优先,见 engine/spec.py 的 model 优先级)。

defaults:
  # 各 agent executor 的公共缺省值。8 步足够"查两次考据 + 产出",再多通常是
  # 模型在原地打转(见 agent/agent.py 对 max_steps 耗尽的告警)。
  executor:
    max_steps: 8

# --- 3.1 输入解析:纯粹的默认值填充,用普通函数比用 LLM 更可靠也更省钱 --------
input_parsing:
  executor: input_parsing_executor
  writes:
    - story_bible.meta

# --- 3.2 立意扩展 ------------------------------------------------------------
concept_expansion:
  executor:
    tools:
      - research
    output_schema: concept_expansion_output
    prompt: "@concept_expansion_prompt"
  reads:
    - story_bible.meta
  writes:
    - story_bible.meta

# --- 3.3 角色与世界观设计 ----------------------------------------------------
character_world_design:
  executor:
    tools:
      - research
    output_schema: character_world_design_output
    prompt: "@character_world_design_prompt"
  reads:
    - story_bible.meta
  writes:
    - story_bible.meta
    - story_bible.characters
    - story_bible.world

# --- 3.4/3.5 大纲生成与修订(同一个节点:游标为空是生成,带着上一轮意见是修订)
# 上一轮为什么没过,由引擎发布在 _loop.outline_loop.last(名字来自 workflow.yaml
# 里那个 loop 的 name),这里用普通的 reads 读它。
outline_generation:
  executor:
    tools:
      - research
    output_schema: outline_generation_output
    prompt: "@outline_generation_prompt"
  reads:
    - _loop.outline_loop.last
    - story_bible.meta
    - story_bible.characters
    - story_bible.world
  writes:
    - story_bible.chapters
    - story_bible.foreshadowing
    - story_bible.meta

# --- 3.5 大纲评审(Critic,不负责改写,所以没有 writes) ---------------------
outline_critic:
  executor:
    output_schema: critic_output
    prompt: "@outline_critic_prompt"
  reads:
    - story_bible.meta
    - story_bible.characters

# --- 3.5.1 大纲人工复核:AI 通过后才轮到人工(AI 判否时 Loop 已短路) --------
confirm_outline:
  checkpoint:
    prompt: 大纲已通过 AI 评审,请确认是否按此大纲进入逐章撰写;不通过请给出修改意见。
    resume_input_schema: critic_output

# --- 3.6 逐章撰写与修订(同样是一个节点两种用法) ---------------------------
chapter_drafting:
  executor:
    tools:
      - research
    output_schema: chapter_drafting_output
    prompt: "@chapter_drafting_prompt"
  reads:
    - _loop.chapter_review_loop.last
    - _foreach.chapter_loop.item
    - story_bible.meta
    - story_bible.characters
    - story_bible.world
    - story_bible.foreshadowing
    - story_bible.chapters
  writes:
    - story_bible.chapters

# --- 3.8 章节审校 ------------------------------------------------------------
# 过审后还要把该章 status 推进到 "reviewed",那一步是引擎表达不了的状态写回,
# 由 stages.py 在本节点外面包一层(见 _with_status_writeback)。
chapter_critic:
  executor:
    tools:
      - qa
    output_schema: critic_output
    prompt: "@chapter_critic_prompt"
  reads:
    - story_bible.characters
    - story_bible.world
    - story_bible.timeline
    - story_bible.foreshadowing

# --- 3.8.0.1 章节人工复核(同样被 stages.py 包了一层:判否要把该章打回 drafted)
chapter_pause:
  checkpoint:
    prompt: 本章已通过 AI 审校,请确认是否继续下一章;不通过请给出修改意见。
    resume_input_schema: critic_output

# --- 3.8.1 章节定稿:兜底把 status 推进到 "reviewed",纯函数 ------------------
chapter_finalize:
  executor: chapter_finalize_executor
  reads:
    - _foreach.chapter_loop.item

# --- 3.9 全文统稿与润色 ------------------------------------------------------
manuscript_assembly_polish:
  executor:
    output_schema: manuscript_assembly_polish_output
    prompt: "@manuscript_assembly_polish_prompt"
  reads:
    - story_bible.chapters
    - story_bible.foreshadowing
    - story_bible.meta
  writes:
    - story_bible.chapters
    - story_bible.foreshadowing

# --- 3.10 最终校验与输出:字数/结构核对,纯函数 ------------------------------
final_qa:
  executor: final_qa_executor
  reads:
    - story_bible.chapters
    - story_bible.meta
  writes:
    - story_bible.chapters
