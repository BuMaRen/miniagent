# 只有 topic 是必填项,其余留空/省略时由 stages.input_parsing_executor 填默认值。
topic: >-
  现代厦门人听着“河西走廊之梦”入睡,随即穿越来到汉武帝建元年间的长安(实际
  只是做了一个很长的梦)。他先是怀疑,确定自己真的穿越之后想方设法在巨大的
  语言和文化差异中谨小慎微地存活下来,体验到了不一样的繁华与社会风貌。而后
  机缘巧合之下被选为随张骞出使西域的随行人员,由于知道这一路有多苦,他想跑但
  束手无策,只能跟随历经艰险的张骞一路前行,不幸被俘虏。他不像张骞,对西汉并
  没有家的归属感,这十年他对匈奴人有了新的客观的看法,逐渐在匈奴安顿下来。由
  于知道后面有机会溜走,他一开始就小心翼翼地准备十年后会用到的物品和技能,并
  将印象中贝尔格里尔斯提到的求生技能记录下来练习备用。再经历了十年大大小小
  的各种事情之后他随张骞出逃,继续接下来的旅程。再次历经生死,再次被俘,他回到
  匈奴妻子身边,妻子是女奴,身体一直不好,他回来后不久妻子就去世了。他自己也
  因为长期累积的伤病,不久便卧床不起,与张骞等人分别后不久便去世了。他睁开眼睛
  发现天已经亮了,手机里还播放着“河西走廊之梦”的音乐,泪眼朦胧。

genre: 历史·现实主义
pov: 第三人称限知视角,不使用第一人称"我",通篇以主角姓名(或对应称呼)指代主角
tone: 沉稳克制,重考据与心理真实,不写无所不能的穿越爽文,着重描写长安的社会风貌,匈奴的生活习俗和一路上的奇遇险境
structure_template: 三幕式
target_word_count: [8000, 20000]
