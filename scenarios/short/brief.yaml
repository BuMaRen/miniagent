# ============================================================================
# 用户设定 —— 这是**你唯一需要改的文件**:它只说"写什么",不说"怎么写"。
#
# "怎么写"(节奏、爽点结构、语言底线、输出契约)全部在 prompts.py 里,与题材
# 无关,不需要也不应该在这里重复;反过来,这里写的任何内容都不会渗进流程的
# 写作准则 —— 两份 prompt 是分开的。
#
# 字段清单由 brief.py 的 BRIEF_FIELDS 唯一定义,随时可以用
#     python -m scenarios.short.run --show-fields
# 打印出来。填了清单之外的键会直接报错(而不是被静默忽略)。
# 只有 premise 是必填的,其余留空表示"由模型自行决定"。
# ============================================================================

# 【必填】一句到一段话讲清这个故事:谁、遇到什么、要干什么。
premise: >-
  我本是海城首富独女，与青梅竹马的邻家大哥结婚的第一年后却被她和小三毒害身亡。
  由于怨念太强，不愿投胎，黄泉路上偶遇鬼王。
  鬼王一见钟情，助我复仇，让渣男前夫和小三受尽折磨灰飞烟灭。
  过程中也帮助其他冤魂神掌正义。最终和鬼王在阴间守护一方安宁。

# 时代/地点/世界规则等背景设定。
setting: 当代中国二线城市

# 主角设定:身份、初始处境、底牌或优势。
protagonist: >-

# 对手或压力来源:可以是具体的人,也可以是处境或制度。
antagonist: >-
  渣男前夫和小三

# 想要的爽点类型(可以写成列表,也可以用顿号分隔一行)。
hook_types:
  - 找到更好的
  - 打脸
  - 底牌反转

# 期望的结局走向。
ending: 最终和鬼王在阴间守护一方安宁

# 题材标签。
genre: 都市志怪言情

# 叙述人称与视角,全篇不得漂移。
pov: 第三人称限知视角,全程跟随主角

# 语气基调。
tone: 冷硬克制,不油腻,爽点靠信息差和翻盘节奏,不靠主角喊口号

# 不希望出现的内容。
taboos: 不要出现系统/金手指/重生穿越,不要写血腥暴力细节,不要用商战术语堆砌

# 其他要求:必须出现的桥段、指定的名字、结尾方式等。
# extra: 结尾要回到外卖箱这个意象;母亲的病不要用来强行煽情

# 目标总字数区间 [下限, 上限]。
target_word_count: [8000, 10000]

# 希望分成几节;填 0 表示由大纲阶段自己决定(4-10 节)。
section_count: 4
