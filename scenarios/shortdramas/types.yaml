# 框架读取这种自定义的数据结构文件，创建新的类型，存储起来
# 当这些类型在此引用或在正式声明中出现的时候根据这里声明的
# 情况进行校验

enums:
  - name: dynamic_enum
    values:
      - name: value1
        description: This is the first value of the dynamic enum.
      - name: value2
        description: This is the second value of the dynamic enum.
objects:
  - name: dynamic_object
    properties:
      - name: property1
        type: string
        description: This is the first property of the dynamic object.
      - name: property2
        type: dynamic_enum
        description: This is the second property of the dynamic object, which uses the dynamic enum defined above.


